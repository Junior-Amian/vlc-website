; ---------------------------------------------------------------------------
; Réglages PHP de l'API, lus par PHP-FPM / CGI (cas courant des mutualisés
; cPanel). Avec mod_php, ce fichier est ignoré : voir les mêmes valeurs dans
; .htaccess.
;
; L'espace client accepte des documents de 10 Mo (DocumentStore::MAX_BYTES).
; Les limites de PHP sont un peu au-dessus, pour que ce soit l'API qui
; refuse un fichier trop lourd, avec un message clair, plutôt que PHP en
; silence. Beaucoup d'hébergeurs fixent 2 Mo par défaut.
; ---------------------------------------------------------------------------

upload_max_filesize = 12M
post_max_size = 13M
max_file_uploads = 10
